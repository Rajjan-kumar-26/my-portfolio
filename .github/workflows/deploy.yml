name: Deploy Portfolio to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout GitHub repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Check GitHub OIDC claims
      # This does NOT print the full OIDC token.
      - name: Check OIDC claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          printf '%s' "$TOKEN" | python3 -c '
          import sys
          import json
          import base64

          token = sys.stdin.read().strip()
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("OIDC sub:")
          print(claims.get("sub"))

          print("OIDC aud:")
          print(claims.get("aud"))
          '

      # 3. Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::019226871793:role/portfolio
          aws-region: ap-south-1

      # 4. Verify AWS authentication
      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      # 5. Deploy portfolio to S3
      - name: Deploy to S3
        run: |
          aws s3 sync . s3://portfolio-rajjan/ \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"
