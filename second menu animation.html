<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>One by One Scroll Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #1f242d;
      color: white;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #24292f;
      padding: 10px 20px;
      display: flex;
      gap: 20px;
      z-index: 1000;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 16px;
    }

    section {
      min-height: 100vh;
      padding: 100px 40px;
    }

    /* Animation base */
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.6s ease-out;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Delay classes */
    .delay-1 { transition-delay: 0.2s; }
    .delay-2 { transition-delay: 0.4s; }
    .delay-3 { transition-delay: 0.6s; }
    .delay-4 { transition-delay: 0.8s; }
    .delay-5 { transition-delay: 1s; }

    section:nth-child(even) {
      background-color: #2e2e3a;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
  </nav>

  <!-- Sections -->
  <section id="home">
    <h1 class="reveal delay-1">Welcome</h1>
    <p class="reveal delay-2">This is the home section.</p>
    <p class="reveal delay-3">We are adding one-by-one animation.</p>
  </section>

  <section id="about">
    <h1 class="reveal delay-1">About Me</h1>
    <p class="reveal delay-2">I'm a web developer.</p>
    <p class="reveal delay-3">I love creating smooth animations.</p>
    <p class="reveal delay-4">Currently learning Cloud and DevOps.</p>
  </section>

  <!-- JS: Reveal on Scroll -->
  <script>
    const reveals = document.querySelectorAll('.reveal');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, {
      threshold: 0.1
    });

    reveals.forEach(element => {
      observer.observe(element);
    });
  </script>

</body>
</html>
