<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>5 Part Reload Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body{
        background-color: aqua;
    }

    body, html {
      height: 100%;
    
      overflow: hidden;
    }

    .loader-wrapper {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: 9999;
    }

    .panel {
      width: 100%;
      height: 20%;
      background-color: #ffffff;
      animation: slideUp 1s forwards;
    }

    .panel:nth-child(1) { animation-delay: 0s; }
    .panel:nth-child(2) { animation-delay: 0.2s; }
    .panel:nth-child(3) { animation-delay: 0.4s; }
    .panel:nth-child(4) { animation-delay: 0.6s; }
    .panel:nth-child(5) { animation-delay: 0.8s; }

    @keyframes slideUp {
      from {
        transform: translateX(0%);
      }
      to {
        transform: translateX(100%);
      }
    }

    
  </style>
</head>
<body>
  <!-- Animation Panels -->
  <div class="loader-wrapper">
    <div class="panel"></div>
    <div class="panel"></div>
    <div class="panel"></div>
    <div class="panel"></div>
    <div class="panel"></div>
  </div>

  <!-- Actual Page Content -->
  

  <script>
    // Wait for animation to complete
    setTimeout(() => {
      document.querySelector(".loader-wrapper").style.display = "none";
      document.querySelector(".content").style.display = "block";
      document.body.style.overflow = "auto";
    }, 2000); // 2 seconds total delay
  </script>
</body>
</html>
